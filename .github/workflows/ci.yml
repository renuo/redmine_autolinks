name: ci

on: push

env:
  BUNDLE_PATH: ~/.bundle/gems

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redmine_branch: [6.0-stable, master]
    steps:
      - name: Checkout Redmine
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.redmine_branch }}
          repository: redmine/redmine

      - name: Checkout Autolinks
        uses: actions/checkout@v4
        with:
          path: plugins/redmine_autolinks
          repository: renuo/redmine_autolinks

      - name: Restore cache
        uses: actions/cache@v4
        with:
          key: gems-${{ hashFiles('Gemfile') }}
          restore-keys: gems
          path: ~/.bundle/gems

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
          ruby-version: 3.3

      - name: Set up Autolinks
        run: bin/setup
        working-directory: plugins/redmine_autolinks

      - name: Run linters
        run: bin/fastcheck
        working-directory: plugins/redmine_autolinks

      - name: Run tests
        run: bin/check
        working-directory: plugins/redmine_autolinks
